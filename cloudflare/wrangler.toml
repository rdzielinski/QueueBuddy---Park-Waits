name = "queuebuddy-push"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# Active push tokens + last-known waits live here. Created via the
# Cloudflare MCP; do NOT rename without also updating the namespace in
# the dashboard, or the cron job will silently see an empty store.
[[kv_namespaces]]
binding = "PUSH_KV"
id = "57eae629a7974190934fdd6734c54179"

# Long-form wait history (weeks/months). One row per attraction sample,
# inserted by the every-5-minutes cron. Read on demand by the iOS app
# to backfill sparklines beyond what the on-device 24h cap retains.
[[d1_databases]]
binding = "HISTORY_DB"
database_name = "queuebuddy_history"
database_id = "384e23b4-e104-44b5-9447-60dbe4f4c51e"

# Two cron schedules:
#   *      / minute  → fan out Live Activity pushes to active tokens
#   */5    / minute  → sample every park's live data into D1 history
# The handler dispatches on `event.cron` to pick which job to run.
# Apple recommends ≤1 push/min so the per-minute schedule is the floor;
# */5 for history sampling is plenty for hourly-resolution charts and
# keeps D1 writes well under the free-tier 100k/day cap.
[triggers]
crons = ["* * * * *", "*/5 * * * *"]

# Non-secret env. Real APNs key (.p8 contents) lives in Workers Secrets:
#   wrangler secret put APNS_KEY
# That keeps the private key out of source control even though the
# rest of the config is committed.
[vars]
APNS_HOST = "api.push.apple.com"
# APNS_BUNDLE_ID, APNS_TEAM_ID, APNS_KEY_ID — set as secrets too. They
# aren't sensitive in the same way as the key, but keeping them out of
# wrangler.toml means we don't accidentally commit the wrong account's
# IDs.

# Observability — keep cron + push errors visible. Worker logs are free.
[observability]
enabled = true
head_sampling_rate = 1
